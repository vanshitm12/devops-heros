replicaCount: 2

image:
  repository: ghcr.io/REPLACE_OWNER/devops-demo
  tag: REPLACE_TAG
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

config:
  appEnv: production

secret:
  enabled: false
  name: devops-demo-secret

ingress:
  enabled: false
  className: nginx
  host: devops-demo.local

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 50

persistence:
  enabled: false
  size: 1Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
