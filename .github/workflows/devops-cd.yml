name: DevOps Demo Manual Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Full commit SHA of a published, security-checked image'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
      - name: Deploy approved image
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full commit SHA"; exit 1; }
          [[ -n "$KUBECONFIG_B64" ]] || { echo "KUBECONFIG_B64 is not configured"; exit 1; }
          umask 077
          export KUBECONFIG
          KUBECONFIG=$(mktemp)
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install devops-demo final-devops-project/helm/devops-demo \
            --namespace devops-demo --create-namespace \
            --set-string image.repository="ghcr.io/${owner}/devops-demo" \
            --set-string image.tag="$IMAGE_TAG" --wait --timeout 5m
