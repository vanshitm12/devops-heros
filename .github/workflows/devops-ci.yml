name: DevOps Demo CI and Security

on:
  push:
    branches: [main]
    paths:
      - 'final-devops-project/**'
      - '.github/workflows/devops-ci.yml'
  pull_request:
    paths:
      - 'final-devops-project/**'
      - '.github/workflows/devops-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and security tooling
        run: |
          python -m pip install -r final-devops-project/application/requirements.txt
          python -m pip install bandit==1.8.3 pip-audit==2.9.0 detect-secrets==1.5.0
      - name: Unit tests
        working-directory: final-devops-project/application
        run: python -m unittest discover -s tests -v
      - name: Static analysis
        run: bandit -q -r final-devops-project/application -x final-devops-project/application/tests
      - name: Dependency audit
        run: pip-audit -r final-devops-project/application/requirements.txt
      - name: Secret scan
        run: |
          detect-secrets scan final-devops-project > "$RUNNER_TEMP/secret-scan.json"
          python - "$RUNNER_TEMP/secret-scan.json" <<'PY'
          import json
          import sys
          results = json.load(open(sys.argv[1], encoding="utf-8"))["results"]
          if results:
              print("Potential secrets detected in:", ", ".join(sorted(results)))
              sys.exit(1)
          print("No potential secrets detected")
          PY
      - name: Build container image
        run: docker build -t devops-demo:scan final-devops-project/application
      - name: Container image vulnerability gate
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: devops-demo:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested source
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/devops-demo:${GITHUB_SHA}"
          docker build -t "$image" final-devops-project/application
          docker push "$image"
